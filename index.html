    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: left;
        }
        
        /* Lista de contactos estilo la imagen */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #000000;
            font-weight: bold;
            font-size: 18px;
        }

        .icon-circle {
            background-color: #00C853;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Botón de Share inferior */
        .share-container {
            text-align: center;
            margin-top: 20px;
        }

        .btn-share {
            background-color: #00C853;
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 12px rgba(0,200,83,0.3);
            transition: background 0.2s;
        }

        .btn-share:hover {
            background-color: #00b048;
        }

        .qr-section {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        #qrcode img {
            margin: 0 auto;
            border-radius: 8px;
        }
    </style>
</head>

        <!-- Código QR -->
        <div class="qr-section">

        </div>

    </div>

    <script>
        // Genera el código QR automáticamente
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 120,
            height: 120,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Función del botón Share
        document.getElementById('shareButton').addEventListener('click', async () => {
            const shareData = {
                title: 'López Equipment Services LLC',
                text: '¡Conoce los servicios profesionales de López Equipment Services!',
                url: window.location.href
            };
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(shareData.url);
                    alert('¡Enlace copiado al portapapeles!');
                }
            } catch (err) {
                console.log('Error al compartir', err);
            }
        });
    </script>
