<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>López Equipment Services LLC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .company-logo-container {
            width: 100%;
            margin-bottom: 15px;
        }
        .company-logo-container img {
            width: 100%;
            max-width: 280px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .profile-photo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .profile-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 21px;
            color: #111;
            margin-bottom: 8px;
            font-weight: bold;
        }
        p.subtitle {
            font-size: 14.5px;
            color: #222;
            margin-bottom: 22px;
            line-height: 1.5;
            padding: 0 10px;
            font-weight: 600;
        }
        .btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 10px 15px 10px 10px;
            margin-bottom: 12px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
            background-color: #ffffff;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #eaeaea;
        }
        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
            background-color: #25d366;
            color: #fff;
        }
        .btn-text {
            text-align: left;
            flex-grow: 1;
            color: #333;
        }
        .btn-share {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60%;
            margin: 20px auto 15px auto;
            padding: 12px 20px;
            border-radius: 50px;
            background-color: #25d366;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            gap: 8px;
        }
        .qr-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-container p {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
            font-weight: 600;
        }
        #qrcode img {
            margin: 0 auto;
            border-radius: 8px;
        }
        .contact-details {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
        .admin-footer {
            display: none; /* Oculto por defecto para los clientes */
            margin-top: 25px;
            border-top: 1px dashed #ddd;
            padding-top: 15px;
            text-align: center;
        }

            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
