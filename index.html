<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>López Equipment Services LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .profile-photo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto -60px;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }
        .profile-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-content {
            padding-top: 80px;
        }
        .company-logo-container {
            width: 100%;
            max-width: 180px;
            margin: 0 auto 15px;
        }
        .company-logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        h1 {
            font-size: 20px;
            color: #111;
            margin-bottom: 5px;
            font-weight: bold;
        }
        p.subtitle {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.4;
            padding: 0 10px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
            text-align: left;
            position: relative;
            padding-left: 45px;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn::before {
            font-family: sans-serif;
            font-size: 18px;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
        }
        .btn-primary {
            background-color: #0056b3;
            color: #fff;
        }
        .btn-primary::before { content: "📞"; }

        .btn-whatsapp {
            background-color: #25d366;
            color: #fff;
        }
        .btn-whatsapp::before { content: "💬"; }

        .btn-secondary {
            background-color: #e9ecef;
            color: #333;
        }
        .btn-secondary.email::before { content: "📧"; }
        .btn-secondary.contact::before { content: "💾"; }

        .contact-details {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-photo-container">
            <img src="mi-foto.jpg" alt="Darwin López">
        </div>

        <div class="card-content">
            <div class="company-logo-container">
                <img src="logo.png" alt="López Equipment Services LLC Logotipo">
            </div>
            
            <h1>López Equipment Services LLC</h1>
            <p class="subtitle">I provide repair and maintenance services for restaurant and supermarket equipment, including grinders, saw, slicers, peelers, and meat tenderizers, among others</p>

            <a href="tel:954-864-8960" class="btn btn-primary">Call: 954-864-8960</a>
            <a href="https://wa.me/19548648960?text=Hello,%20I%20saw%20your%20digital%20card%20and%20I'm%20interested%20in%20your%20services." class="btn btn-whatsapp" target="_blank">Send WhatsApp</a>
            <a href="mailto:Lopezeqp@gmail.com" class="btn btn-secondary email">Send Email: Lopezeqp@gmail.com</a>
            <a href="telprompt:954-864-8960" class="btn btn-secondary contact">Save Contact</a>
                
                <p>Florida, USA</p>
            </div>
        </div>
    </div>

</body>
</html>
