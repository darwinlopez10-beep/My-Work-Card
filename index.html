<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>López Equipment Services LLC</title>
    <style>
        :root {
            --primary-green: #28a745;
            --dark-green: #218838;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-gray: #b0b0b0;
            --accent-border: #333333;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid var(--accent-border);
            text-align: center;
            padding: 30px 20px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-green);
            margin-bottom: 15px;
        }

        .company-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-light);
        }

        .owner-name {
            font-size: 16px;
            color: var(--text-gray);
            margin-bottom: 15px;
        }

        .services-desc {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 320px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-call {
            background-color: #007bff;
            color: white;
        }
        .btn-call:hover { background-color: #0056b3; }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
        }
        .btn-whatsapp:hover { background-color: #1ebe5d; }

        .share-btn {
            background-color: var(--primary-green);
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .share-btn:hover {
            background-color: var(--dark-green);
        }

        .btn svg {
            margin-right: 10px;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-gray);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Foto de Perfil o Logotipo -->
        <img src="logo.png" alt="Darwin López" class="profile-img" onerror="this.src='https://via.placeholder.com/110?text=DL'">
        
        <h1 class="company-title">López Equipment Services LLC</h1>
        <div class="owner-name">Darwin López</div>
        
        <p class="services-desc">
            Professional repair and maintenance services for commercial food processing equipment, restaurant, and supermarket machinery.
        </p>

        <div class="action-buttons">
            <!-- Botón de Llamar -->
            <a href="tel:+14070000000" class="btn btn-call">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Llamar Ahora
            </a>

            <!-- Botón de WhatsApp -->
            <a href="https://wa.me/14070000000" target="_blank" class="btn btn-whatsapp">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                WhatsApp Directo
            </a>

            <!-- Botón Verde de Compartir Integrado -->
            <button id="shareButton" class="btn share-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                Compartir Tarjeta
            </button>
        </div>

        <div class="footer-note">
            Commercial Equipment Services &bull; Windermere, FL
        </div>
    </div>

    <script>
        document.getElementById('shareButton').addEventListener('click', async () => {
            const shareData = {
                title: 'López Equipment Services LLC',
                text: '¡Conoce los servicios profesionales de reparación de equipos comerciales de López Equipment Services!',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(shareData.url);
                    alert('¡Enlace de la tarjeta copiado al portapapeles!');
                }
            } catch (err) {
                console.log('Error al compartir: ', err);
            }
        });
    </script>
</body>
</html>
